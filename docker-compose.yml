# Despliegue completo: MySQL + API (Node/Express + Angular) + nginx
# Uso en el servidor:  docker compose up -d --build
# Variables desde ./.env en la raíz del repo (ver env.example)

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    # Memoria reducida: la VM tiene 1 GB RAM
    command: --innodb-buffer-pool-size=64M --max-connections=40
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: gestion_comunicacion_social
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -s"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - appnet

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: gestion_comunicacion_social
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
    networks:
      - appnet

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - appnet

volumes:
  dbdata:

networks:
  appnet:
