# nginx: HTTP → redirige a HTTPS; HTTPS sirve la app (proxy a la API)
# Certificados Let's Encrypt en /etc/letsencrypt (certbot --webroot + renovación automática)

server {
    listen 80;
    server_name comunicacion-social.duckdns.org;

    # Validación Let's Encrypt (se mantiene para renovaciones)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name comunicacion-social.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/comunicacion-social.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comunicacion-social.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # Todo va al backend (Node sirve Angular + /api con fallback SPA)
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 60s;
    }
}
