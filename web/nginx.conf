# nginx: solo HTTP al inicio (fase 5 se agrega HTTPS con certbot)
# Proxy a la API (Node sirve Angular + /api con fallback SPA)

server {
    listen 80;
    server_name comunicacion-social.duckdns.org;

    # Ruta de validación Let's Encrypt (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás va al backend
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 60s;
    }
}
